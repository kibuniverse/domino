# Triggered by `pnpm release` (bumpp): commit + tag vX.Y.Z + push.
#
# Publishes to npm staging, not directly. The version is not public until a
# maintainer reviews it and approves the stage with 2FA. Approval cannot be
# automated: an OIDC token may only run `npm stage publish`, never `npm stage approve`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Must match "Environment name" in the npm trusted publisher settings: fill in
    # `npm` there, not blank. GitHub puts the environment in the OIDC token and npm
    # compares it, so a mismatch is rejected.
    environment: npm
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing: npm mints a short-lived credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          # Do not add registry-url: it writes an empty _authToken line into .npmrc,
          # which makes npm skip OIDC and fall back to token auth, failing with ENEEDAUTH.
      # Staged publishing needs npm >= 11.20.0; Node 22 bundles 10.9.x.
      - run: npm install -g npm@11.20.0
      - run: pnpm install --frozen-lockfile
      # Also builds dist/, so the stage step below can run with --ignore-scripts.
      # .npmrc pins use-node-version=22.23.3, so check/build runs on that Node.
      - run: pnpm check
      # npm (not pnpm) publishes: provenance is reliable there. There is no NPM_TOKEN;
      # auth is OIDC trusted publishing, and the SLSA provenance attestation is attached
      # automatically for a public package published from a public repo.
      - name: Stage npm package
        id: stage
        run: |
          set -euo pipefail
          name=$(node -p 'require("./package.json").name')
          out=$(npm stage publish --access public --tag latest --ignore-scripts --json --registry https://registry.npmjs.org/)
          printf '%s\n' "$out"
          stage_id=$(printf '%s' "$out" | jq -r --arg n "$name" '(.[$n] // .) | .stageId // empty')
          [ -n "$stage_id" ] || { echo "::error::npm did not return a stageId; check the staging queue before retrying"; exit 1; }
          echo "stage_id=$stage_id" >> "$GITHUB_OUTPUT"
          {
            echo "## npm package staged — awaiting approval"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`$name\` |"
            echo "| dist-tag | \`latest\` (immutable once staged) |"
            echo "| Stage ID | \`$stage_id\` |"
            echo
            echo "Not public yet. Review and approve with 2FA: \`npm stage view $stage_id\` then \`npm stage approve $stage_id\`."
            echo "An OIDC token cannot approve; a maintainer must log in and complete 2FA."
          } >> "$GITHUB_STEP_SUMMARY"
      # Created only after staging succeeds, so a failed stage leaves no Release.
      # gh cannot combine --notes with --generate-notes, so the changelog is fetched
      # separately and the staging notice is prepended. Keeping the notice in the
      # Release body matters because the Release exists before the package is public.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          set -euo pipefail
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          {
            echo "> **npm 状态（打 tag 时）**：本版本已提交 npm 暂存，**尚未公开**。"
            echo "> 需维护者登录 npmjs.com 审核并通过 2FA 批准后，才会落到 \`latest\`；"
            echo "> 此 Release 的存在不代表 npm 审批已完成。"
            echo "> Stage ID：\`$STAGE_ID\`（也可用 \`npm stage approve $STAGE_ID\` 批准）。"
            echo
            echo "$notes"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
